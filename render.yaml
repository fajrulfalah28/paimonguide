services:
  - type: web
    name: paimon-ner-service
    env: python
    plan: free
    rootDir: ner-service
    buildCommand: "pip install -r requirements.txt && python -m nltk.downloader averaged_perceptron_tagger averaged_perceptron_tagger_eng"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: web
    name: paimon-guide
    env: docker
    plan: free
    rootDir: paimon-guide
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:aTns3BGdD4sAwfkGbg3oXvh+6vomIxCgCA37ysXLmsY=
      - key: DB_CONNECTION
        value: sqlite
      - key: NER_SERVICE_URL
        fromService:
          type: web
          name: paimon-ner-service
          envVarKey: RENDER_EXTERNAL_URL
        transform: "${value}/extract"
